<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VEMLAB · Comprueba con el circuito equivalente los parámetros del transformador y del motor asíncrono calculados en el laboratorio.">
    <title>VEMLAB · Laboratorio virtual de máquinas eléctricas</title>
    <link rel="stylesheet" href="css/main.css?v=4">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 12c1.4-3 2.8-3 4.1 0s2.7 3 4.1 0 2.4-2.4 2.8-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="brand-name">VEMLAB</span>
        </div>
        <nav class="machine-tabs" role="tablist" aria-label="Máquina">
            <button type="button" role="tab" data-m="motor">Máquina asíncrona</button>
            <button type="button" role="tab" data-m="trafo">Transformador</button>
        </nav>
        <button type="button" class="icon-btn" id="btn-theme" aria-label="Cambiar tema">☾</button>
    </header>

    <main class="bench">
        <p class="howto"><span id="machine-sub"></span> · Introduce los parámetros que has calculado, conecta la máquina como en el laboratorio y compara lo que da el simulador con lo que mediste.</p>

        <div class="layout">
            <aside class="card params">
                <div class="card-head">
                    <h2><span class="num-badge">1</span>Tus parámetros</h2>
                    <button type="button" class="btn btn-ghost btn-sm" id="btn-defaults" title="Cargar valores de ejemplo">Ejemplo</button>
                </div>
                <div id="params-form" class="params-form"></div>
                <p class="note" id="params-note"></p>
            </aside>

            <div class="work">
                <section class="card conn">
                    <div class="card-head"><h2><span class="num-badge">2</span>Conexión</h2></div>
                    <div id="modes"></div>
                    <p class="mode-help" id="mode-help"></p>
                    <div id="controls" class="controls"></div>
                </section>

                <section class="card diag">
                    <div id="diagram" class="diagram-wrap"></div>
                    <div id="alarm" class="alarm" hidden></div>
                </section>

                <section class="card readings">
                    <div class="card-head">
                        <h2><span class="num-badge">3</span>Compara con tus medidas</h2>
                        <button type="button" class="btn btn-ghost btn-sm" id="btn-clear">Borrar medidas</button>
                    </div>
                    <div class="table-wrap">
                        <table class="cmp">
                            <thead><tr><th scope="col">Magnitud</th><th scope="col">Simulador</th><th scope="col">Tu medida</th><th scope="col">Diferencia</th></tr></thead>
                            <tbody id="readings-body"></tbody>
                        </table>
                    </div>
                    <p id="verdict" class="verdict"></p>
                </section>
            </div>
        </div>
    </main>

    <script src="js/core.js?v=4"></script>
    <script src="js/trafo.js?v=4"></script>
    <script src="js/motor.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
</body>
</html>
